name: One-time academic-research-suite import

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-academic-research-suite.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Copy the pinned upstream skill and license, then remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/import-academic-research-suite.yml
          source_commit=52228e8280dd1770e18ecfc3b1fdf16b13b58104
          source="$(mktemp -d)"

          git clone --depth 1 --filter=blob:none --sparse --no-checkout \
            https://github.com/Imbad0202/academic-research-skills-codex.git "$source"
          git -C "$source" fetch --depth 1 origin "$source_commit"
          git -C "$source" checkout --detach "$source_commit"
          git -C "$source" sparse-checkout set skills/academic-research-suite
          git -C "$source" show "$source_commit:LICENSE" > "$RUNNER_TEMP/upstream-LICENSE"

          mkdir -p .agents/skills
          cp -a "$source/skills/academic-research-suite" .agents/skills/
          cp "$RUNNER_TEMP/upstream-LICENSE" LICENSE

          diff -qr "$source/skills/academic-research-suite" .agents/skills/academic-research-suite
          cmp "$RUNNER_TEMP/upstream-LICENSE" LICENSE
          git add -- .agents/skills/academic-research-suite LICENSE
          git rm -- "$workflow"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Copy academic-research-suite Codex skill"
          git push origin "HEAD:$GITHUB_REF_NAME"
